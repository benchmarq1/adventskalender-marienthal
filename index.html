<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lebendiger Adventskalender Marienthal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap">
<style id="app-style">
:root{
  --bg:#0a1f15; --panel:#11301f; --land:#123323; --street-hi:#3d6a52;
  --text:#eef4ee; --muted:#a7bfae; --gold:#f5c451; --red:#d23c34; --red-hi:#ff6a5e;
  --line:#21472f; --danger:#ff8a7a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Work Sans",system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 70% -10%,#16422b 0%,transparent 60%),
  radial-gradient(800px 400px at 0% 0%,#123a26 0%,transparent 55%),var(--bg)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--red-hi);font-weight:600}
h1{font-family:"Fraunces",serif;font-weight:700;font-size:clamp(28px,4.4vw,46px);line-height:1.05;margin:6px 0 8px;letter-spacing:-.01em}
.intro{color:var(--muted);max-width:620px;margin:0;line-height:1.5;font-size:15px}
.status{background:rgba(210,60,52,.16);border:1px solid rgba(255,106,94,.5);color:#ffd2cc;border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap}
.mapcard{position:relative;background:var(--land);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mapscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mapcard svg{display:block;width:100%;height:auto;touch-action:pan-x pan-y}
.mapnote{position:absolute;left:12px;bottom:10px;font-size:11px;color:#8fb09b;pointer-events:none;background:rgba(10,31,21,.7);padding:2px 8px;border-radius:6px}
.star{cursor:pointer;outline:none}
.star .shape{fill:var(--gold);stroke:#fff3cf;stroke-width:2.4;filter:url(#glow);transition:transform .15s}
.star text{font:700 22px "Work Sans",sans-serif;fill:#3a2600;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.star:hover .shape,.star:focus-visible .shape{transform:scale(1.18)}
.star.past .shape{fill:#8a7440;stroke:#b9a56f;filter:none}
.star.past text{fill:#2a2110}
.star.sel .shape{transform:scale(1.32);stroke:var(--red-hi);stroke-width:5}
.star.today .halo{animation:pulse 1.8s ease-out infinite}
.halo{fill:none;stroke:var(--red-hi);stroke-width:4;opacity:0}
@keyframes pulse{0%{r:28px;opacity:.9}100%{r:70px;opacity:0}}
.editing .star{cursor:grab}
.placing svg{cursor:crosshair}
.pop{position:absolute;z-index:5;width:270px;background:#fffaf0;color:#2a2112;border-radius:14px;padding:14px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);transform:translate(-50%,calc(-100% - 22px))}
.pop.below{transform:translate(-50%,22px)}
.pop::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:#fffaf0;transform:translateX(-50%) rotate(45deg)}
.pop.below::after{bottom:auto;top:-7px}
.pop-day{font-size:12px;font-weight:600;color:#b3261e;text-transform:uppercase;letter-spacing:.08em;padding-right:22px}
.pop-addr{font-family:"Fraunces",serif;font-size:21px;font-weight:700;margin:6px 0 2px;line-height:1.15}
.pop-city{font-size:13px;color:#6b5c40}
.pop-host{margin-top:10px;font-size:14px;color:#2a2112}.pop-host b{color:#b3261e}
.pop-time{margin-top:10px;font-weight:600;font-size:15px}
.pop-note{margin-top:6px;font-size:14px;color:#4b3f2a;line-height:1.4}
.pop a{display:inline-block;margin-top:10px;font-size:13px;color:#b3261e;font-weight:600;text-decoration:none;border-bottom:1px solid #e9a39d}
.pop-x{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:20px;line-height:1;color:#8b7a5a;cursor:pointer;padding:4px 6px}
h2{font-family:"Fraunces",serif;font-size:22px;margin:34px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.door{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--text);font:inherit;transition:border-color .15s,transform .15s}
.door:hover{border-color:var(--red-hi);transform:translateY(-1px)}
.door.sel{border-color:var(--red-hi);background:#183d28}
.door.past{opacity:.55}
.door.today{border-color:var(--red-hi);box-shadow:0 0 0 2px rgba(255,106,94,.3)}
.door .n{font-family:"Fraunces",serif;font-size:24px;font-weight:700;color:var(--gold);line-height:1}
.door .d{font-size:12px;color:var(--muted);margin-top:4px}
.door .h{font-size:12px;color:var(--muted);margin-top:2px}
.door .s{font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{font:600 14px "Work Sans",sans-serif;border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.btn:hover{border-color:var(--street-hi)}
.btn.primary{background:var(--red);color:#fff;border-color:var(--red)}
.btn.primary:hover{background:#e14a41}
.btn.small{padding:6px 10px;font-size:13px}
.btn.on{background:#4a1714;border-color:var(--red-hi);color:#ffd2cc}
.msg{font-size:14px;color:var(--muted)}
.msg.err{color:var(--danger)}
.banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:600;font-size:14px;border-radius:999px;padding:8px 16px;z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.admin{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.admin h3{margin:0 0 12px;font-family:"Fraunces",serif;font-size:19px}
.settings{display:grid;grid-template-columns:110px 1fr 1fr;gap:10px;margin-bottom:18px}
.settings label,.rowhead{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.settings .full{grid-column:1/-1}
input,textarea{width:100%;font:14px "Work Sans",sans-serif;background:#0b2416;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus{outline:none;border-color:var(--red-hi)}
input[type=time]{color-scheme:dark}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:30px 70px minmax(150px,2fr) minmax(110px,1.3fr) 86px 86px minmax(130px,2fr) 104px;gap:8px;align-items:center}
.row .num{font-family:"Fraunces",serif;font-weight:700;color:var(--gold);font-size:18px;text-align:center}
.row .dt{font-size:12px;color:var(--muted)}
.row.hl{background:#183d28;border-radius:10px;outline:1px solid var(--red-hi);outline-offset:3px}
details{margin-top:16px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
textarea{min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px;margin-top:10px}
footer{margin-top:40px;color:#7f9d89;font-size:12px}
@media (max-width:820px){
  .row{grid-template-columns:30px 1fr 1fr;grid-template-areas:"n s s" "n h h" "d f t" "x x p"}
  .row .num{grid-area:n}.row .dt{grid-area:d}.row .f-street{grid-area:s}.row .f-host{grid-area:h}.row .f-from{grid-area:f}.row .f-to{grid-area:t}.row .f-note{grid-area:x}.row .place{grid-area:p}
  .row{padding:8px;border-bottom:1px solid var(--line)}
  .settings{grid-template-columns:1fr}
}
@media (max-width:640px){
  .mapcard svg{min-width:820px}
  .pop,.pop.below{position:fixed;left:12px!important;right:12px;top:auto!important;bottom:12px;width:auto;transform:none}
  .pop::after{display:none}
  .status{white-space:normal}
}
</style>

  s+='<text x="900" y="95" font-size="24" font-style="italic" fill="#8fc4a2" text-anchor="middle">Wandsbeker Gehölz</text>';
  s+='<text x="2220" y="470" font-size="24" font-style="italic" fill="#8fc4a2" text-anchor="middle">Wandsbeker Gehölz</text>';
  s+='<text x="765" y="745" font-size="19" font-style="italic" fill="#8fc4a2" text-anchor="middle">Marienanlage</text>';
  s+='<text x="1060" y="440" font-size="17" font-style="italic" fill="#76aebf" transform="rotate(68 1060 440)">Gehölzgraben</text>';
  STREETS.forEach(function(st){if(st.name)s+=labelsFor(st,21,"#c9dccf");});
  MAJOR.forEach(function(st){s+=labelsFor(st,23,"#f0e6d2");});
  /* A24-Schilder */
  [[900,1185],[1640,1066],[2250,968]].forEach(function(p){s+='<g transform="translate('+p[0]+','+p[1]+')"><rect x="-26" y="-15" width="52" height="30" rx="7" fill="#2b5aa8" stroke="#fff" stroke-width="2.5"/><text text-anchor="middle" dominant-baseline="central" font-size="19" font-weight="700" fill="#fff">A24</text></g>';});
  /* Kompass */
  s+='<g transform="translate(2390,1180)"><circle r="38" fill="#0f2c1d" stroke="#2f5c42" stroke-width="2"/><path d="M0 -26 L10 8 L0 0 L-10 8Z" fill="#d23c34"/><text y="26" text-anchor="middle" font-size="17" fill="#c9dccf">N</text></g>';
  return s;
}
var BASE=baseMap();


function starsSVG(){
  var s="";
  cur().doors.slice().sort(function(a,b){return (state.sel===a.n)-(state.sel===b.n);}).forEach(function(d){
    var st=dayStatus(d.n),cls="star "+st+(state.sel===d.n?" sel":"");
    s+='<g class="'+cls+'" data-n="'+d.n+'" transform="translate('+d.x+','+d.y+')" tabindex="0" role="button" aria-label="Türchen '+d.n+': '+esc(d.street)+'">'+
       '<circle class="halo" r="28"/><polygon class="shape" points="'+STAR+'"/><text y="3">'+d.n+'</text></g>';
  });
  return s;
}

/* ---------- render ---------- */
function render(){
  var c=cur(),h="";
  h+='<div class="wrap'+(state.editing?" editing":"")+'">';
  h+='<header><div><div class="eyebrow">Advent '+esc(c.year)+' · Hamburg-Marienthal</div><h1>'+esc(c.title)+'</h1><p class="intro">'+esc(c.intro)+'</p></div><div class="status">'+esc(statusText())+'</div></header>';
  h+='<div class="mapcard'+(state.placing?" placing":"")+'" id="mapcard">';
  if(state.placing)h+='<div class="banner">Klicke auf die Karte, um Türchen '+state.placing+' zu platzieren</div>';
  h+='<div class="mapscroll"><svg id="map" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">'+BASE+'<g id="stars">'+starsSVG()+'</g></svg></div>';
  h+='<div class="mapnote">Straßenverlauf vereinfacht dargestellt</div>';
  h+=popupHTML();
  h+='</div>';
  if(state.editing)h+=adminHTML();
  else{
    h+='<h2>Alle 24 Türchen</h2><div class="grid">';
    c.doors.forEach(function(d){var st=dayStatus(d.n);
      h+='<button class="door '+st+(state.sel===d.n?" sel":"")+'" data-door="'+d.n+'"><div class="n">'+d.n+'</div><div class="d">'+esc(fmtDate(d.n,{weekday:"short",day:"numeric",month:"short"}))+' · '+esc(fmtTime(d.from))+'</div><div class="s">'+esc(d.street||"–")+'</div>'+(d.host?'<div class="h">'+esc(d.host)+'</div>':"")+'</button>';});
    h+='</div>';
    if(state.canEdit)h+='<div class="toolbar"><button class="btn" data-act="edit">Adressen bearbeiten</button>'+msgHTML()+'</div>';
  }
  h+='<footer>Lebendiger Adventskalender · Nachbarschaft Hamburg-Marienthal</footer></div>';
  root.innerHTML=h;
  if(state.hl){var r=root.querySelector('.row[data-row="'+state.hl+'"]');if(r)r.scrollIntoView({block:"nearest",behavior:"smooth"});state.hl=null;}
}
function msgHTML(){return state.msg?'<span class="msg'+(state.msgErr?" err":"")+'">'+esc(state.msg)+'</span>':"";}
function popupHTML(){
  if(state.sel==null||state.placing)return "";
  var d=door(state.sel);if(!d)return "";
  var below=d.y<470,left=Math.min(Math.max(d.x/W*100,14),86),top=d.y/H*100;
  return '<div class="pop'+(below?" below":"")+'" style="left:'+left+'%;top:'+top+'%">'+
    '<button class="pop-x" data-act="close" aria-label="Schließen">×</button>'+
    '<div class="pop-day">Türchen '+d.n+' · '+esc(fmtDate(d.n))+'</div>'+
    '<div class="pop-addr">'+esc(d.street||"Adresse folgt")+'</div><div class="pop-city">'+esc(cur().city)+'</div>'+
    (d.host?'<div class="pop-host">bei <b>'+esc(d.host)+'</b></div>':"")+
    '<div class="pop-time">'+esc(timeText(d))+'</div>'+
    (d.note?'<div class="pop-note">'+esc(d.note)+'</div>':"")+
    (d.street?'<a href="'+esc(mapsLink(d))+'" target="_blank" rel="noopener">In Google Maps öffnen ↗</a>':"")+
  '</div>';
}
function adminHTML(){
  var c=state.draft,h='<div class="admin"><h3>Adressen verwalten</h3>';
  h+='<div class="settings"><div><label>Jahr</label><input type="number" data-s="year" value="'+esc(c.year)+'"></div><div><label>Titel</label><input data-s="title" value="'+esc(c.title)+'"></div><div><label>PLZ / Ort</label><input data-s="city" value="'+esc(c.city)+'"></div><div class="full"><label>Einleitungstext</label><input data-s="intro" value="'+esc(c.intro)+'"></div></div>';
  h+='<div class="row" style="margin-bottom:2px"><span class="rowhead">Nr.</span><span class="rowhead">Datum</span><span class="rowhead">Straße & Hausnummer</span><span class="rowhead">Gastgeber</span><span class="rowhead">Von</span><span class="rowhead">Bis</span><span class="rowhead">Hinweis (optional)</span><span class="rowhead">Position</span></div>';
  h+='<div class="rows">';
  c.doors.forEach(function(d){
    h+='<div class="row'+(state.sel===d.n?" hl":"")+'" data-row="'+d.n+'"><span class="num">'+d.n+'</span><span class="dt">'+esc(fmtDate(d.n,{weekday:"short",day:"numeric",month:"numeric"}))+'</span>'+
      '<input class="f-street" data-n="'+d.n+'" data-f="street" value="'+esc(d.street)+'" placeholder="z. B. Rauchstraße 12">'+
      '<input class="f-host" data-n="'+d.n+'" data-f="host" value="'+esc(d.host||"")+'" placeholder="z. B. Familie Müller">'+
      '<input class="f-from" type="time" data-n="'+d.n+'" data-f="from" value="'+esc(d.from)+'">'+
      '<input class="f-to" type="time" data-n="'+d.n+'" data-f="to" value="'+esc(d.to)+'">'+
      '<input class="f-note" data-n="'+d.n+'" data-f="note" value="'+esc(d.note)+'" placeholder="z. B. Kinderpunsch">'+
      '<button class="btn small place'+(state.placing===d.n?" on":"")+'" data-place="'+d.n+'">'+(state.placing===d.n?"Klick auf Karte…":"Auf Karte setzen")+'</button></div>';
  });
  h+='</div>';
  h+='<p class="msg" style="margin-top:12px">Tipp: Im Bearbeitungsmodus kannst du die Sterne auch direkt auf der Karte verschieben.</p>';
  h+='<div class="toolbar"><button class="btn primary" data-act="save">Speichern & veröffentlichen</button><button class="btn" data-act="cancel">Abbrechen</button><button class="btn" data-act="copy">Als JSON kopieren</button>'+msgHTML()+'</div>';
  h+='<details><summary>Daten als JSON einfügen (z. B. aus einer Tabelle)</summary><textarea id="jsonin" placeholder="JSON hier einfügen …"></textarea><div class="toolbar"><button class="btn small" data-act="import">Übernehmen</button></div></details>';
  h+='</div>';
  return h;
}
function setMsg(t,err){state.msg=t;state.msgErr=!!err;}

/* ---------- events ---------- */
root.addEventListener("click",function(e){
  var t=e.target.closest("[data-act],[data-door],[data-place]");
  if(t){
    if(t.dataset.door){state.sel=+t.dataset.door;render();var m=document.getElementById("mapcard");if(m)m.scrollIntoView({behavior:"smooth",block:"start"});return;}
    if(t.dataset.place){var n=+t.dataset.place;state.placing=state.placing===n?null:n;state.sel=n;render();return;}
    var a=t.dataset.act;
    if(a==="close"){state.sel=null;render();}
    else if(a==="edit"){state.draft=JSON.parse(JSON.stringify(data));state.editing=true;setMsg("");render();}
    else if(a==="cancel"){state.editing=false;state.draft=null;state.placing=null;setMsg("");render();}
    else if(a==="save")save();
    else if(a==="copy")copyJSON();
    else if(a==="import")importJSON();
    return;
  }
  if(e.target.closest("#map")&&!e.target.closest(".star")){
    if(state.placing){var p=svgPoint(e);var d=door(state.placing);d.x=Math.round(p.x);d.y=Math.round(p.y);state.sel=state.placing;state.placing=null;render();}
    else if(state.sel!=null&&!dragMoved){state.sel=null;render();}
  }
});
root.addEventListener("keydown",function(e){
  var g=e.target.closest&&e.target.closest(".star");
  if(g&&(e.key==="Enter"||e.key===" ")){e.preventDefault();selectStar(+g.dataset.n);}
  if(e.key==="Escape"&&state.sel!=null){state.sel=null;render();}
});
root.addEventListener("input",function(e){
  var el=e.target;if(!state.editing)return;
  if(el.dataset.s){var v=el.value;state.draft[el.dataset.s]=el.dataset.s==="year"?(parseInt(v,10)||data.year):v;}
  else if(el.dataset.f){var d=door(+el.dataset.n);if(d)d[el.dataset.f]=el.value;}
});
function selectStar(n){state.sel=n;if(state.editing)state.hl=n;render();}

/* drag + click on stars */
var drag=null,dragMoved=false;
function svgPoint(e){var svg=document.getElementById("map"),pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;var p=pt.matrixTransform(svg.getScreenCTM().inverse());return {x:Math.max(10,Math.min(W-10,p.x)),y:Math.max(10,Math.min(H-10,p.y))};}
root.addEventListener("pointerdown",function(e){
  var g=e.target.closest(".star");if(!g)return;
  dragMoved=false;drag={n:+g.dataset.n,g:g,sx:e.clientX,sy:e.clientY};
  if(state.editing){try{g.setPointerCapture(e.pointerId);}catch(_){}}
});
root.addEventListener("pointermove",function(e){
  if(!drag||!state.editing)return;
  if(Math.abs(e.clientX-drag.sx)+Math.abs(e.clientY-drag.sy)>4)dragMoved=true;
  if(dragMoved){var p=svgPoint(e);drag.g.setAttribute("transform","translate("+p.x.toFixed(0)+","+p.y.toFixed(0)+")");drag.p=p;}
});
root.addEventListener("pointerup",function(){
  if(!drag)return;var dr=drag;drag=null;
  if(dragMoved&&state.editing&&dr.p){var d=door(dr.n);d.x=Math.round(dr.p.x);d.y=Math.round(dr.p.y);state.sel=dr.n;render();setTimeout(function(){dragMoved=false;},0);return;}
  if(state.placing)return;
  selectStar(dr.n);
});

/* ---------- import / export ---------- */
function validate(o){
  if(!o||!Array.isArray(o.doors))throw new Error("Es fehlt die Liste „doors“.");
  var out=JSON.parse(JSON.stringify(state.draft||data));
  ["year","title","intro","city"].forEach(function(k){if(o[k]!=null)out[k]=k==="year"?parseInt(o[k],10)||out.year:String(o[k]);});
  o.doors.forEach(function(d){var n=parseInt(d.n,10);if(!(n>=1&&n<=24))return;var t=out.doors[n-1];
    ["street","host","from","to","note"].forEach(function(k){if(d[k]!=null)t[k]=String(d[k]);});
    if(isFinite(d.x)&&isFinite(d.y)){t.x=+d.x;t.y=+d.y;}});
  return out;
}
function importJSON(){
  var ta=document.getElementById("jsonin");
  try{state.draft=validate(JSON.parse(ta.value));setMsg("Daten übernommen – noch nicht gespeichert.");}catch(err){setMsg("JSON konnte nicht gelesen werden: "+err.message,true);}
  render();
}
function copyJSON(){
  var txt=JSON.stringify(state.draft||data,null,2);
  try{navigator.clipboard.writeText(txt).then(function(){setMsg("JSON in die Zwischenablage kopiert.");render();},function(){fallback();});}catch(_){fallback();}
  function fallback(){setMsg("Kopieren nicht möglich – JSON steht unten im Feld.");render();var d=root.querySelector("details");if(d)d.open=true;var ta=document.getElementById("jsonin");if(ta){ta.value=txt;ta.select();}}
}

/* ---------- save: regenerate this page with new data and publish ---------- */
function buildDoc(obj){
  var css=document.getElementById("app-style").textContent;
  var js=document.getElementById("app").textContent;
  var json=JSON.stringify(obj).replace(/</g,"\\u003c");
  var S="<"+"script",E="<"+"/script>";
  return "<!DOCTYPE html>\n<html lang=\"de\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Lebendiger Adventskalender Marienthal</title>\n"+
    "<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Work+Sans:wght@400;500;600&display=swap\">\n"+
    "<style id=\"app-style\">"+css+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n"+
    S+" type=\"application/json\" id=\"advent-data\">"+json+E+"\n"+S+" id=\"app\">"+js+E+"\n</body>\n</html>\n";
}
function save(){
  var d=state.draft;
  var missing=d.doors.filter(function(x){return !x.street.trim();}).length;
  setMsg("Speichere …");render();
  Promise.resolve(window.claude&&window.claude.use?window.claude.use("artifact"):null).then(function(art){
    if(!art){setMsg("Speichern ist hier nicht verfügbar. Nutze „Als JSON kopieren“ und schick mir die Daten.",true);render();return;}
    return art.publish(buildDoc(d)).then(function(){
      data=d;state.editing=false;state.draft=null;setMsg("Gespeichert"+(missing?" ("+missing+" Türchen ohne Adresse)":"")+".");render();
    });
  }).catch(function(err){
    var m=String(err&&(err.code||err.message)||err);
    if(/not_granted|not_writer/.test(m))setMsg("Du hast keine Berechtigung, diese Seite zu ändern.",true);
    else if(/conflict/.test(m))setMsg("Jemand anderes hat gerade gespeichert – die Seite lädt neu.",true);
    else setMsg("Speichern fehlgeschlagen: "+m,true);
    render();
  });
}

/* ---------- boot ---------- */
render();
if(location.hash==="#admin"){state.canEdit=true;render();}
if(window.claude&&window.claude.use){
  window.claude.use("user").then(function(u){
    if(!u)return null;return Promise.resolve(u.canEdit()).then(function(ok){if(ok){state.canEdit=true;if(!state.editing)render();}});
  }).catch(function(){});
}
})();
</script>
</body>
</html>
